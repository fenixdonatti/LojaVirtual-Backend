spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

# Database credentials
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Specify the PostgreSQL driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Creates and updates tables based on the JPA entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the logs (helpful for debugging)
spring.jpa.show-sql=true

# Format the SQL logs nicely
spring.jpa.properties.hibernate.format_sql=true

# Database platform dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME}